name: unit-tests

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  unit-linux:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        env:
          PIP_CONSTRAINT: constraints.txt
        run: |
          python -m pip install --upgrade pip
          python -m pip install -c constraints.txt -e ".[validation,data]"
      - name: Run unit tests
        run: python -m unittest discover -s mlx_genkit/tests -p 'test_*.py' -q

  unit-macos-mlx:
    runs-on: macos-14
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        env:
          PIP_CONSTRAINT: constraints.txt
        run: |
          python -m pip install --upgrade pip
          python -m pip install -c constraints.txt -e ".[validation,data]"
      - name: Run unit tests
        run: python -m unittest discover -s mlx_genkit/tests -p 'test_*.py' -q

  build-and-twine-check:
    runs-on: ubuntu-latest
    needs:
      - unit-linux
      - unit-macos-mlx
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build distribution and verify metadata
        env:
          PIP_CONSTRAINT: constraints.txt
        run: |
          python -m pip install --upgrade pip
          python -m pip install -c constraints.txt build twine
          python -m build
          python -m twine check dist/*
